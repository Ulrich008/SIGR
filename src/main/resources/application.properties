spring.profiles.active=local
# Nom de l'application
spring.application.name=SIGR

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/sigrbased
spring.datasource.username=ulrich
spring.datasource.password=rich

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# HIBERNATE ENVERS (AUDIT TRAIL)
# ===============================
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_audit
spring.jpa.properties.org.hibernate.envers.revision_field_name=revision_id
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revision_type

# ===============================
# SWAGGER CONFIG
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.syntax-highlight.theme=dark

# Chemin par défaut (ne pas changer sauf besoin)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# EMAIL (notifications critiques/hautes — voir EmailService)
# ===============================
# Tant que spring.mail.host est vide, l'envoi d'email est simplement
# désactivé (log seul) : les notifications in-app fonctionnent sans
# configuration SMTP. Renseigner ces 4 clés pour l'activer.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=assogbaulrich1@gmail.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL du frontend, utilisée pour construire le lien de réinitialisation de
# mot de passe envoyé par email (voir AuthServiceImpl.motDePasseOublie).
app.frontend-url=http://localhost:4200

# ===============================
# SERVER
# ===============================
server.port=8080
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===============================
# UPLOAD (import Excel agents / unités administratives)
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB