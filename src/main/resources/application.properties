spring.profiles.active=local
# Nom de l'application
spring.application.name=SIGR

# ===============================
# DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/sigr
spring.datasource.username=ulrich
spring.datasource.password=rich

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# SWAGGER CONFIG
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.syntax-highlight.theme=dark

# Chemin par défaut (ne pas changer sauf besoin)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===============================
# SERVER
# ===============================
server.port=8080